[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "handoff-copilot"
dynamic = ["version"]
description = "Screening-call drafts a person submits: hiring signals backed by quotes checked against the transcript, a scorecard draft with no rating, and a handoff note that checks contact, owner and next step. Greenhouse Harvest v3 is one connector."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Lopez" }]
keywords = ["recruiting", "greenhouse", "harvest", "llm", "pii", "audit log", "shadow mode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[project.scripts]
handoff-copilot = "handoff_copilot.cli:main"

[project.urls]
Repository = "https://github.com/woodbeary/handoff-copilot"

[tool.hatch.version]
path = "src/handoff_copilot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/handoff_copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
